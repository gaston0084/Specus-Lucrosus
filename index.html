<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specus Lucrosus</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #8b0000;
      padding: 20px 30px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 2px;
    }

    .header .logo {
      width: 100px;
      height: 100px;
      background-color: #200000;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 0.85rem;
      text-align: center;
      border: 2px solid #660000;
    }

    .bottom-gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 40px 30px;
      justify-items: center;
    }

    .gallery-item {
      text-align: center;
    }

    .gallery-item img {
      width: 100%;
      max-width: 220px;
      height: 220px;
      object-fit: cover;
      border: 2px solid #8b0000;
      background-color: #111;
    }

    .gallery-item h2 {
      margin-top: 15px;
      font-size: 1rem;
      color: #ffdddd;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @media (max-width: 900px) {
      .bottom-gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header .logo {
        margin-top: 15px;
      }

      .bottom-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>SPECUS LUCROSUS</h1>
    <div class="logo">LOGO ICI</div>
  </header>

  <section class="bottom-gallery">

    <div class="gallery-item">
      <img src="Image (4).jpg" alt="Le requin mesquin">
      <h2>Le requin mesquin</h2>
    </div>

    <div class="gallery-item">
      <img src="Guepard.jpg" alt="Le guépard flemmard">
      <h2>Le guépard flemmard</h2>
    </div>

    <div class="gallery-item">
      <img src="Dromadair.jpg" alt="Le dromadaire patibulaire">
      <h2>Le dromadaire patibulaire</h2>
    </div>

    <div class="gallery-item">
      <img src="Raton-Laveur.jpg" alt="Le raton-laveur râleur">
      <h2>Le raton-laveur râleur</h2>
    </div>

  </section>

</body>
</html>
