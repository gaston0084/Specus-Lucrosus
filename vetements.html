<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les vêtements de notre communauté</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #8b0000;
      padding: 20px 30px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 2px;
    }

    .header a {
      color: #fff;
      text-decoration: underline;
    }

    .page-title {
      text-align: center;
      font-size: 1.8rem;
      letter-spacing: 1px;
      color: #ffdddd;
      text-transform: uppercase;
      margin: 40px 20px 10px;
    }

    .page-intro {
      max-width: 700px;
      margin: 0 auto 50px;
      padding: 0 20px;
      text-align: center;
      font-size: 1rem;
      color: #eee;
      line-height: 1.5;
    }

    .clothing-list {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 30px 60px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .clothing-item {
      display: flex;
      align-items: center;
      gap: 25px;
      background-color: #111;
      border: 2px solid #8b0000;
      border-radius: 8px;
      padding: 20px;
    }

    .clothing-item img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      flex-shrink: 0;
      background-color: #200000;
      border: 2px solid #660000;
    }

    .clothing-text h2 {
      margin: 0 0 10px;
      font-size: 1.2rem;
      color: #ffdddd;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .clothing-text p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #ddd;
    }

    @media (max-width: 600px) {
      .clothing-item {
        flex-direction: column;
        text-align: center;
      }

      .clothing-item img {
        width: 100%;
        max-width: 220px;
      }
    }
  </style>
</head>
